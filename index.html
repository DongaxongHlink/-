<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grand Luxury Interactive Christmas Tree</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { margin: 0; padding: 0; overflow: hidden; background: #050505; color: #fff; font-family: 'Inter', sans-serif; }
      canvas { display: block; }
      @keyframes fade-in { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes slide-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in { animation: fade-in 1s ease-out forwards; }
      .animate-slide-up { animation: slide-up 1s ease-out forwards; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom": "https://esm.sh/react-dom@^19.2.3",
        "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
        "@react-three/fiber": "https://esm.sh/@react-three/fiber@^9.5.0",
        "three": "https://esm.sh/three@^0.182.0",
        "@react-three/drei": "https://esm.sh/@react-three/drei@^10.7.7",
        "@react-three/postprocessing": "https://esm.sh/@react-three/postprocessing@^3.0.4"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="text/babel" data-type="module">
      import React, { useState, useMemo, useRef, useEffect } from 'react';
      import { createRoot } from 'react-dom/client';
      import { Canvas, useFrame } from '@react-three/fiber';
      import * as THREE from 'three';
      import { OrbitControls, PerspectiveCamera, Environment, Stars } from '@react-three/drei';
      import { EffectComposer, Bloom, SSAO, ToneMapping } from '@react-three/postprocessing';

      // --- Constants & Types ---
      const TreeState = { CHAOS: 'CHAOS', FORMED: 'FORMED' };
      const COLORS = {
        GOLD: [230 / 255, 200 / 255, 100 / 255],
        DARK_GREEN: [20 / 255, 60 / 255, 20 / 255],
        BG: '#050505',
      };
      const TREE_CONFIG = {
        HEIGHT: 4.2,
        BASE_RADIUS: 1.4,
        CHAOS_RADIUS: 5.5,
        TRANSITION_DURATION: 1.5,
        NEEDLE_COUNT: 30000,
        GIFT_COUNT: 750,
        BALL_COUNT: 1800,
        LIGHT_COUNT: 150,
      };
      const LUXURY_COLORS = [
        '#d4af37', '#c0c0c0', '#b22222', '#0047ab', '#006400', 
        '#ffdf00', '#800020', '#e5e4e2', '#b76e79', '#ffffff'
      ];

      // --- Utils ---
      const easeInOutQuad = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const getRandomInSphere = (radius) => {
        const u = Math.random(), v = Math.random();
        const theta = 2 * Math.PI * u, phi = Math.acos(2 * v - 1);
        const r = radius * Math.pow(Math.random(), 1 / 3);
        return [r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi)];
      };
      const getTreePosition = (height, baseRadius, tier, surfaceBiased = false) => {
        let y = tier !== undefined ? (tier * (height / 3) + Math.random() * (height / 3)) : (Math.random() * height);
        const radiusAtY = baseRadius * (1 - y / height);
        const angle = Math.random() * Math.PI * 2;
        const distMultiplier = surfaceBiased ? 0.7 + Math.random() * 0.3 : Math.sqrt(Math.random());
        const dist = distMultiplier * radiusAtY;
        return [Math.cos(angle) * dist, y - height / 2, Math.sin(angle) * dist];
      };

      // --- Components ---
      const Needles = ({ progress }) => {
        const count = TREE_CONFIG.NEEDLE_COUNT;
        const { chaos, target, offsets } = useMemo(() => {
          const c = new Float32Array(count * 3), t = new Float32Array(count * 3), o = new Float32Array(count);
          for (let i = 0; i < count; i++) {
            const cp = getRandomInSphere(TREE_CONFIG.CHAOS_RADIUS), tp = getTreePosition(TREE_CONFIG.HEIGHT, TREE_CONFIG.BASE_RADIUS);
            c.set(cp, i * 3); t.set(tp, i * 3); o[i] = Math.random() * 100;
          }
          return { chaos: c, target: t, offsets: o };
        }, []);

        const uniforms = useMemo(() => ({
          uProgress: { value: 0 }, uTime: { value: 0 },
          uGold: { value: new THREE.Color(...COLORS.GOLD) },
          uGreen: { value: new THREE.Color(...COLORS.DARK_GREEN) },
        }), []);

        useFrame((state) => {
          uniforms.uProgress.value = progress;
          uniforms.uTime.value = state.clock.elapsedTime;
        });

        return (
          <points>
            <bufferGeometry>
              <bufferAttribute attach="attributes-position" count={count} array={chaos} itemSize={3} />
              <bufferAttribute attach="attributes-chaosPosition" count={count} array={chaos} itemSize={3} />
              <bufferAttribute attach="attributes-targetPosition" count={count} array={target} itemSize={3} />
              <bufferAttribute attach="attributes-randomOffset" count={count} array={offsets} itemSize={1} />
            </bufferGeometry>
            <shaderMaterial
              transparent depthWrite={false} blending={THREE.AdditiveBlending}
              uniforms={uniforms}
              vertexShader={`
                uniform float uProgress; uniform float uTime;
                attribute vec3 chaosPosition; attribute vec3 targetPosition; attribute float randomOffset;
                varying float vDist;
                void main() {
                  vec3 animatedTarget = targetPosition + (sin(uTime * 0.5 + randomOffset) * 0.04);
                  vec3 pos = mix(chaosPosition, animatedTarget, uProgress);
                  vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                  gl_PointSize = (32.0 / -mvPosition.z) * (0.85 + 0.35 * sin(uTime * 2.0 + randomOffset));
                  gl_Position = projectionMatrix * mvPosition;
                  vDist = length(targetPosition.xz);
                }
              `}
              fragmentShader={`
                uniform vec3 uGold; uniform vec3 uGreen;
                varying float vDist;
                void main() {
                  if (distance(gl_PointCoord, vec2(0.5)) > 0.5) discard;
                  float edge = smoothstep(0.5, 1.4, vDist);
                  gl_FragColor = vec4(mix(uGold, uGreen, edge * 0.10), (1.0 - distance(gl_PointCoord, vec2(0.5)) * 2.0) * 0.9);
                }
              `}
            />
          </points>
        );
      };

      const Decorations = ({ progress }) => {
        const giftsRef = useRef(); const ballsRef = useRef(); const dummy = useMemo(() => new THREE.Object3D(), []);
        const giftData = useMemo(() => Array.from({ length: TREE_CONFIG.GIFT_COUNT }, () => {
          const tier = Math.random() < 0.60 ? 0 : (Math.random() < 0.90 ? 1 : 2);
          return {
            chaos: getRandomInSphere(TREE_CONFIG.CHAOS_RADIUS),
            target: getTreePosition(TREE_CONFIG.HEIGHT, TREE_CONFIG.BASE_RADIUS * 0.95, tier, true),
            scale: [0.04 + Math.random() * 0.12, 0.04 + Math.random() * 0.12, 0.04 + Math.random() * 0.12],
            color: new THREE.Color(LUXURY_COLORS[Math.floor(Math.random() * LUXURY_COLORS.length)]),
            rot: [Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI]
          };
        }), []);
        const ballData = useMemo(() => Array.from({ length: TREE_CONFIG.BALL_COUNT }, () => {
          const tier = Math.random() < 0.55 ? 0 : (Math.random() < 0.88 ? 1 : 2);
          const r = Math.random();
          return {
            chaos: getRandomInSphere(TREE_CONFIG.CHAOS_RADIUS),
            target: getTreePosition(TREE_CONFIG.HEIGHT, TREE_CONFIG.BASE_RADIUS * 1.05, tier, true),
            scale: r < 0.12 ? 0.14 : (r < 0.4 ? 0.08 : 0.03 + Math.random() * 0.04),
            color: new THREE.Color(LUXURY_COLORS[Math.floor(Math.random() * LUXURY_COLORS.length)])
          };
        }), []);
        useFrame(({ clock }) => {
          giftData.forEach((d, i) => {
            dummy.position.set(THREE.MathUtils.lerp(d.chaos[0], d.target[0] + Math.sin(clock.elapsedTime * 0.2 + i) * 0.015, progress), THREE.MathUtils.lerp(d.chaos[1], d.target[1] + Math.cos(clock.elapsedTime * 0.15 + i) * 0.01, progress), THREE.MathUtils.lerp(d.chaos[2], d.target[2] + Math.sin(clock.elapsedTime * 0.25 + i) * 0.015, progress));
            dummy.rotation.set(d.rot[0], d.rot[1] + clock.elapsedTime * 0.08, d.rot[2]); dummy.scale.set(...d.scale); dummy.updateMatrix();
            giftsRef.current.setMatrixAt(i, dummy.matrix); giftsRef.current.setColorAt(i, d.color);
          });
          giftsRef.current.instanceMatrix.needsUpdate = true; giftsRef.current.instanceColor.needsUpdate = true;
          ballData.forEach((d, i) => {
            dummy.position.set(THREE.MathUtils.lerp(d.chaos[0], d.target[0] + Math.sin(clock.elapsedTime * 0.4 + i) * 0.01, progress), THREE.MathUtils.lerp(d.chaos[1], d.target[1] + Math.cos(clock.elapsedTime * 0.35 + i) * 0.01, progress), THREE.MathUtils.lerp(d.chaos[2], d.target[2] + Math.sin(clock.elapsedTime * 0.45 + i) * 0.01, progress));
            dummy.scale.setScalar(d.scale); dummy.updateMatrix();
            ballsRef.current.setMatrixAt(i, dummy.matrix); ballsRef.current.setColorAt(i, d.color);
          });
          ballsRef.current.instanceMatrix.needsUpdate = true; ballsRef.current.instanceColor.needsUpdate = true;
        });
        return (
          <group>
            <instancedMesh ref={giftsRef} args={[null, null, TREE_CONFIG.GIFT_COUNT]}><boxGeometry /><meshStandardMaterial metalness={0.9} roughness={0.05} /></instancedMesh>
            <instancedMesh ref={ballsRef} args={[null, null, TREE_CONFIG.BALL_COUNT]}><sphereGeometry args={[1, 20, 20]} /><meshStandardMaterial metalness={1.0} roughness={0.01} /></instancedMesh>
          </group>
        );
      };

      const Lights = ({ progress }) => {
        const meshRef = useRef(); const dummy = useMemo(() => new THREE.Object3D(), []);
        const data = useMemo(() => Array.from({ length: TREE_CONFIG.LIGHT_COUNT }, () => {
          const tier = Math.random() < 0.5 ? 0 : (Math.random() < 0.85 ? 1 : 2);
          return { chaos: getRandomInSphere(TREE_CONFIG.CHAOS_RADIUS), target: getTreePosition(TREE_CONFIG.HEIGHT, TREE_CONFIG.BASE_RADIUS * 0.85, tier, true), offset: Math.random() * 50, baseScale: 0.025 + Math.random() * 0.02 };
        }), []);
        useFrame(({ clock }) => {
          data.forEach((d, i) => {
            dummy.position.set(THREE.MathUtils.lerp(d.chaos[0], d.target[0] + Math.sin(clock.elapsedTime * 2.5 + d.offset) * 0.03, progress), THREE.MathUtils.lerp(d.chaos[1], d.target[1] + Math.cos(clock.elapsedTime * 2.0 + d.offset) * 0.03, progress), THREE.MathUtils.lerp(d.chaos[2], d.target[2] + Math.sin(clock.elapsedTime * 1.5 + d.offset) * 0.03, progress));
            dummy.scale.setScalar(d.baseScale * (1.2 + Math.sin(clock.elapsedTime * 8 + d.offset) * 0.8)); dummy.updateMatrix(); meshRef.current.setMatrixAt(i, dummy.matrix);
          });
          meshRef.current.instanceMatrix.needsUpdate = true;
        });
        return <instancedMesh ref={meshRef} args={[null, null, TREE_CONFIG.LIGHT_COUNT]}><sphereGeometry args={[1, 16, 16]} /><meshBasicMaterial color={new THREE.Color(...COLORS.GOLD)} /></instancedMesh>;
      };

      const Experience = ({ treeState }) => {
        const [lerp, setLerp] = useState(0);
        useFrame((_, delta) => {
          const target = treeState === TreeState.FORMED ? 1 : 0;
          setLerp(p => {
            if (Math.abs(p - target) < 0.001) return target;
            const step = (1 / TREE_CONFIG.TRANSITION_DURATION) * delta;
            return target > p ? Math.min(p + step, target) : Math.max(p - step, target);
          });
        });
        const progress = easeInOutQuad(lerp);
        return (
          <>
            <PerspectiveCamera makeDefault position={[0, 1, 8]} fov={50} />
            <OrbitControls enablePan={false} minDistance={3} maxDistance={15} autoRotate={treeState === TreeState.FORMED} autoRotateSpeed={0.5} />
            <color attach="background" args={[COLORS.BG]} />
            <ambientLight intensity={0.4} />
            <pointLight position={[10, 10, 10]} intensity={1.5} color={new THREE.Color(...COLORS.GOLD)} />
            <pointLight position={[-10, 5, -10]} intensity={1} color="#ffffff" />
            <Stars radius={100} depth={50} count={5000} factor={4} saturation={0} fade speed={1} />
            <group>
              <Needles progress={progress} /> <Decorations progress={progress} /> <Lights progress={progress} />
              {treeState === TreeState.FORMED && <mesh position={[0, -TREE_CONFIG.HEIGHT / 2 - 0.25, 0]}><cylinderGeometry args={[0.2, 0.2, 0.5]} /><meshStandardMaterial color="#2d1b0d" transparent opacity={progress} /></mesh>}
            </group>
            <Environment preset="night" />
            <EffectComposer multisampling={4}>
              <Bloom intensity={0.8} luminanceThreshold={0.95} luminanceSmoothing={0.6} radius={0.6} />
              <SSAO intensity={0.2} radius={0.1} luminanceInfluence={0.5} />
              <ToneMapping exposure={0.85} />
            </EffectComposer>
          </>
        );
      };

      const App = () => {
        const [state, setState] = useState(TreeState.CHAOS);
        return (
          <div className="relative w-full h-screen bg-black overflow-hidden">
            <Canvas shadows gl={{ antialias: true }} dpr={[1, 2]}><Experience treeState={state} /></Canvas>
            <div className="absolute top-0 left-0 w-full h-full pointer-events-none flex flex-col justify-between p-8 md:p-12">
              <header className="flex justify-between items-start animate-fade-in">
                <div>
                  <h1 className="text-4xl md:text-6xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-[#e6c864] via-[#ffffff] to-[#e6c864]">LUXURY GOLD</h1>
                  <p className="text-[#e6c864]/60 font-medium tracking-widest uppercase text-xs md:text-sm mt-2">Interactive 3D Experience • Est. 2024</p>
                </div>
                <div className="pointer-events-auto"><div className="w-12 h-12 rounded-full border border-[#e6c864]/30 flex items-center justify-center backdrop-blur-md"><span className="text-[#e6c864] text-xl">✨</span></div></div>
              </header>
              <footer className="flex flex-col md:flex-row justify-between items-end gap-6 animate-slide-up">
                <div className="max-w-xs text-left">
                  <h2 className="text-[#e6c864] font-bold text-lg mb-1">State Morphing</h2>
                  <p className="text-white/40 text-sm leading-relaxed">Witness the transition from chaos to a structured holiday masterpiece. Powered by high-precision shaders.</p>
                </div>
                <div className="flex gap-4 pointer-events-auto">
                  <button onClick={() => setState(s => s === TreeState.CHAOS ? TreeState.FORMED : TreeState.CHAOS)} className={`px-8 py-4 rounded-full font-bold uppercase tracking-widest text-sm transition-all duration-500 border-2 shadow-2xl ${state === TreeState.CHAOS ? 'bg-[#e6c864] text-black border-[#e6c864] hover:bg-white hover:border-white' : 'bg-transparent text-[#e6c864] border-[#e6c864]/50 hover:bg-[#e6c864]/10 hover:border-[#e6c864]'}`}>{state === TreeState.CHAOS ? 'Form the Tree' : 'Release Chaos'}</button>
                  <div className="flex items-center gap-4 px-6 py-4 bg-white/5 backdrop-blur-xl border border-white/10 rounded-full"><div className="flex flex-col"><span className="text-[10px] text-white/40 uppercase font-bold tracking-widest">Atmosphere</span><span className="text-[#e6c864] text-sm font-black uppercase">{state === TreeState.CHAOS ? 'Stochastic' : 'Ordered'}</span></div></div>
                </div>
              </footer>
            </div>
            <div className="absolute inset-0 pointer-events-none ring-[40px] ring-black ring-inset opacity-50"></div>
          </div>
        );
      };

      createRoot(document.getElementById('root')).render(<App />);
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
